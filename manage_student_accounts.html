<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مدیریت کاربران | سفینه النجاه</title>
    <style>
        :root {
            --bg-dark: #0a0e17;
            --card-bg: #16213e;
            --neon-blue: #00f9ff;
            --accent-gold: #ffd700;
            --accent-purple: #7000ff;
            --text-color: #e0e0e0;
            --danger: #ff4d4d;
            --success: #00ff88;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-color);
            font-family: 'Tahoma', sans-serif;
            margin: 0;
            padding: 20px;
            line-height: 1.6;
        }

        .container { max-width: 1200px; margin: 0 auto; }

        h1 {
            color: var(--neon-blue);
            text-align: center;
            text-shadow: 0 0 20px rgba(0, 249, 255, 0.5);
            font-size: 2.5rem;
            margin-bottom: 30px;
        }

        /* استایل بخش‌ها */
        .panel-section {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 40px;
            border: 1px solid rgba(0, 249, 255, 0.1);
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
        }

        h2 {
            color: var(--accent-gold);
            margin-top: 0;
            border-bottom: 1px solid rgba(255, 215, 0, 0.2);
            padding-bottom: 10px;
        }

        /* فرم افزودن */
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
        }

        .input-group { display: flex; flex-direction: column; }

        label { font-size: 0.8rem; color: var(--neon-blue); margin-bottom: 5px; }

        input {
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #2c5385;
            background: #0f172a;
            color: white;
            outline: none;
            transition: 0.3s;
        }

        input:focus { border-color: var(--neon-blue); box-shadow: 0 0 8px var(--neon-blue); }

        .btn-add {
            grid-column: 1 / -1;
            background: linear-gradient(45deg, var(--accent-purple), var(--neon-blue));
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
            transition: 0.3s;
        }

        .btn-add:hover { transform: scale(1.02); filter: brightness(1.2); }

        /* جدول مدیریت */
        .table-wrapper { overflow-x: auto; margin-top: 20px; }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 900px;
        }

        th {
            background: rgba(0, 249, 255, 0.05);
            color: var(--neon-blue);
            padding: 15px;
            text-align: right;
            font-size: 0.9rem;
        }

        td {
            padding: 12px 15px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            font-size: 0.85rem;
        }

        tr:hover { background: rgba(255,255,255,0.02); }

        /* قابلیت ویرایش مستقیم */
        .editable {
            background: rgba(255,255,255,0.05);
            border: 1px dashed transparent;
            padding: 5px;
            border-radius: 4px;
            transition: 0.2s;
            display: inline-block;
            width: 90%;
        }

        .editable:focus {
            border-color: var(--accent-gold);
            background: rgba(255,215,0,0.1);
            outline: none;
        }

        /* استایل رمز عبور */
        .pass-container { display: flex; align-items: center; gap: 8px; }
        .btn-eye {
            background: none;
            border: none;
            color: var(--neon-blue);
            cursor: pointer;
            font-size: 1rem;
        }

        /* دکمه‌های عملیات */
        .actions { display: flex; gap: 10px; }
        .btn-del {
            background: var(--danger);
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.75rem;
        }

        .btn-save {
            background: var(--success);
            color: #000;
            border: none;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            display: none; /* در حالت عادی مخفی */
        }

        @media (max-width: 768px) {
            .form-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🚀 مرکز کنترل کاربران سفینه النجاه</h1>

    <!-- بخش افزودن دانش‌آموز -->
    <section class="panel-section">
        <h2>➕ افزودن دانش‌آموز جدید</h2>
        <div class="form-grid">
            <div class="input-group">
                <label>نام</label>
                <input type="text" id="fName" placeholder="نام">
            </div>
            <div class="input-group">
                <label>نام خانوادگی</label>
                <input type="text" id="lName" placeholder="نام خانوادگی">
            </div>
            <div class="input-group">
                <label>ایمیل</label>
                <input type="email" id="email" placeholder="email@domain.com">
            </div>
            <div class="input-group">
                <label>کد ملی</label>
                <input type="text" id="nationalId" placeholder="10 رقم">
            </div>
            <div class="input-group">
                <label>شماره تلفن</label>
                <input type="text" id="phone" placeholder="0912...">
            </div>
            <div class="input-group">
                <label>رمز عبور</label>
                <input type="password" id="pass" placeholder="******">
            </div>
            <button class="btn-add" onclick="addUser()">ثبت در پایگاه داده</button>
        </div>
    </section>

    <!-- بخش مدیریت و جدول -->
    <section class="panel-section">
        <h2>📋 مدیریت و ویرایش حساب‌ها</h2>
        <p style="font-size: 0.8rem; color: #888;">* برای ویرایش، روی هر فیلد کلیک کرده و تغییرات را اعمال کنید، سپس دکمه ذخیره را بزنید.</p>
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>نام و نام خانوادگی</th>
                        <th>ایمیل</th>
                        <th>کد ملی</th>
                        <th>شماره تلفن</th>
                        <th>رمز عبور</th>
                        <th>عملیات</th>
                    </tr>
                </thead>
                <tbody id="userTableBody">
                    <!-- ردیف‌ها اینجا تولید می‌شوند -->
                </tbody>
            </table>
        </div>
    </section>
</div>

<script>
    // داده‌های اولیه (در واقعیت این‌ها از دیتابیس می‌آیند)
    let users = [
        { id: 1, fName: "کیان", lName: "خان", email: "kian@nav.com", nationalId: "1234567890", phone: "09123456789", pass: "kian123" },
        { id: 2, fName: "سارا", lName: "احمدی", email: "sara@nav.com", nationalId: "0987654321", phone: "09351112233", pass: "sara789" }
    ];

    // تابع افزودن کاربر جدید
    function addUser() {
        const newUser = {
            id: Date.now(),
            fName: document.getElementById('fName').value,
            lName: document.getElementById('lName').value,
            email: document.getElementById('email').value,
            nationalId: document.getElementById('nationalId').value,
            phone: document.getElementById('phone').value,
            pass: document.getElementById('pass').value
        };

        if(!newUser.fName || !newUser.email || !newUser.pass) {
            alert("کیان خان، فیلدهای اصلی (نام، ایمیل و رمز) الزامی هستند!");
            return;
        }

        users.unshift(newUser);
        renderUsers();
        clearForm();
    }

    function clearForm() {
        ['fName', 'lName', 'email', 'nationalId', 'phone', 'pass'].forEach(id => {
            document.getElementById(id).value = '';
        });
    }

    // تابع نمایش کاربران
    function renderUsers() {
        const tbody = document.getElementById('userTableBody');
        tbody.innerHTML = '';

        users.forEach(user => {
            const tr = document.createElement('tr');
            tr.setAttribute('data-id', user.id);

            tr.innerHTML = `
                <td>
                    <div class="editable" contenteditable="true" onblur="updateField(${user.id}, 'fName', this.innerText)">${user.fName}</div>
                    <div class="editable" contenteditable="true" onblur="updateField(${user.id}, 'lName', this.innerText)">${user.lName}</div>
                </td>
                <td><div class="editable" contenteditable="true" onblur="updateField(${user.id}, 'email', this.innerText)">${user.email}</div></td>
                <td><div class="editable" contenteditable="true" onblur="updateField(${user.id}, 'nationalId', this.innerText)">${user.nationalId}</div></td>
                <td><div class="editable" contenteditable="true" onblur="updateField(${user.id}, 'phone', this.innerText)">${user.phone}</div></td>
                <td>
                    <div class="pass-container">
                        <span class="editable" id="pass-text-${user.id}" onclick="togglePass(${user.id}, '${user.pass}')">••••••••</span>
                        <button class="btn-eye" onclick="togglePass(${user.id}, '${user.pass}')">👁️</button>
                        <button class="btn-save" id="save-btn-${user.id}" onclick="savePass(${user.id})">ذخیره</button>
                    </div>
                </td>
                <td>
                    <div class="actions">
                        <button class="btn-del" onclick="deleteUser(${user.id})">حذف</button>
                    </div>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    // تابع ویرایش فیلدها (Inline Edit)
    function updateField(id, field, newValue) {
        const userIndex = users.findIndex(u => u.id === id);
        if (userIndex !== -1) {
            users[userIndex][field] = newValue;
            console.log(`فیلد ${field} برای کاربر ${id} به‌روز شد: ${newValue}`);
        }
    }

    // مدیریت نمایش/مخفی‌سازی رمز عبور
    function togglePass(id, actualPass) {
        const passSpan = document.getElementById(`pass-text-${id}`);
        const saveBtn = document.getElementById(`save-btn-${id}`);
        
        if (passSpan.innerText === '••••••••') {
            passSpan.innerText = actualPass;
            passSpan.style.color = 'var(--accent-gold)';
            saveBtn.style.display = 'inline-block';
        } else {
            passSpan.innerText = '••••••••';
            passSpan.style.color = 'inherit';
            saveBtn.style.display = 'none';
        }
    }

    // ذخیره رمز عبور جدید (در صورت تغییر)
    function savePass(id) {
        // در این نسخه ساده، فعلاً فقط حالت نمایش را تغییر می‌دهیم
        // اما منطق ذخیره سازی برای زمانی که کاربر رمز جدیدی تایپ کند آماده است
        alert("رمز عبور به‌روزرسانی شد (در محیط واقعی باید فیلد ورودی نمایش داده شود)");
        togglePass(id, users.find(u => u.id === id).pass); 
    }

    function deleteUser(id) {
        if(confirm("آیا از حذف این کاربر مطمئن هستید؟")) {
            users = users.filter(u => u.id !== id);
            renderUsers();
        }
    }

    // لود اولیه
    renderUsers();
</script>
    <!-- کد جایگزین در بخش اسکریپت -->
<script>
    const STORAGE_KEY = "school_db_students";

    // دریافت لیست و نمایش در جدول
    function renderUsers() {
        const students = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
        const tbody = document.getElementById("userTableBody");
        tbody.innerHTML = "";
        
        students.forEach(student => {
            tbody.innerHTML += `<tr>
                <td>${student.fName}</td>
                <td>${student.email}</td>
                <td>${student.nationalId}</td>
                <td><button onclick="deleteUser(${student.id})">حذف</button></td>
            </tr>`;
        });
    }

    // افزودن دانش‌آموز توسط ادمین
    function addUser() {
        let students = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
        const newStudent = {
            id: Date.now(),
            fName: document.getElementById("fName").value,
            email: document.getElementById("email").value,
            nationalId: document.getElementById("nationalId").value,
            pass: document.getElementById("pass").value
        };

        students.push(newStudent);
        localStorage.setItem(STORAGE_KEY, JSON.stringify(students));
        renderUsers();
    }

    // حذف دانش‌آموز
    function deleteUser(id) {
        let students = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
        students = students.filter(s => s.id !== id);
        localStorage.setItem(STORAGE_KEY, JSON.stringify(students));
        renderUsers();
    }

    // فراخوانی اولیه
    renderUsers();
</script>


</body>
</html>
