<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مدیریت آنلاین کاربران | سفینه النجاه</title>
    <style>
        :root {
            --bg-dark: #0a0e17;
            --card-bg: #16213e;
            --neon-blue: #00f9ff;
            --accent-gold: #ffd700;
            --accent-purple: #7000ff;
            --text-color: #e0e0e0;
            --danger: #ff4d4d;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-color);
            font-family: 'Tahoma', sans-serif;
            margin: 0;
            padding: 20px;
        }

        .container { max-width: 1200px; margin: 0 auto; }

        h1 { color: var(--neon-blue); text-align: center; text-shadow: 0 0 20px rgba(0, 249, 255, 0.5); }

        .panel-section {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 25px;
            border: 1px solid rgba(0, 249, 255, 0.1);
        }

        .table-wrapper { overflow-x: auto; margin-top: 20px; }

        table { width: 100%; border-collapse: collapse; min-width: 900px; }

        th { background: rgba(0, 249, 255, 0.05); color: var(--neon-blue); padding: 15px; text-align: right; }

        td { padding: 12px 15px; border-bottom: 1px solid rgba(255,255,255,0.05); }

        .btn-del {
            background: var(--danger);
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🚀 مرکز کنترل همزمان حساب‌های دانش‌آموزان</h1>

    <section class="panel-section">
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>نام و نام خانوادگی</th>
                        <th>ایمیل</th>
                        <th>کد ملی</th>
                        <th>شماره تلفن</th>
                        <th>رمز عبور</th>
                        <th>عملیات</th>
                    </tr>
                </thead>
                <tbody id="userTableBody">
                    <!-- داده‌ها همزمان از پایگاه داده آنلاین اضافه می‌شوند -->
                </tbody>
            </table>
        </div>
    </section>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script>
    const firebaseConfig = { databaseURL: "https://YOUR_PROJECT_ID.firebaseio.com" };
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    // همگام‌سازی لحظه‌ای (Real-time Sync) برای نمایش ثبت‌نام‌های انجام شده با گوشی‌های مختلف
    database.ref('students').on('value', (snapshot) => {
        const tbody = document.getElementById('userTableBody');
        tbody.innerHTML = '';
        
        snapshot.forEach((childSnapshot) => {
            const user = childSnapshot.val();
            const tr = document.createElement('tr');
            
            tr.innerHTML = `
                <td>${user.fName || ''} ${user.lName || ''}</td>
                <td>${user.email || ''}</td>
                <td>${user.nationalId || ''}</td>
                <td>${user.phone || ''}</td>
                <td>${user.pass || ''}</td>
                <td>
                    <button class="btn-del" onclick="deleteUser('${user.id}')">حذف</button>
                </td>
            `;
            tbody.appendChild(tr);
        });
    });

    function deleteUser(id) {
        if(confirm("آیا از حذف این کاربر اطمینان دارید؟")) {
            database.ref('students/' + id).remove();
        }
    }
</script>
</body>
</html>
