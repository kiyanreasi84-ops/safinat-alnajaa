<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود مدیر</title>
    <style>
        body {
            font-family: sans-serif;
            background: #1a1a2e; /* مشکی-آبی تیره */
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-container {
            background: #0f3460; /* آبی تیره */
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.5); /* لبه‌های آبی روشن */
            text-align: center;
            width: 350px;
        }
        h2 {
            color: #00f9ff; /* آبی روشن */
            margin-bottom: 20px;
        }
        .input-group {
            margin-bottom: 15px;
            text-align: right;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #ccc;
        }
        input[type="text"],
        input[type="password"] {
            width: calc(100% - 20px);
            padding: 10px;
            border: 1px solid #00f9ff;
            border-radius: 5px;
            background: #1a1a2e;
            color: white;
        }
        button {
            background-color: #00f9ff; /* آبی روشن */
            color: #1a1a2e;
            padding: 12px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
            margin-top: 10px;
            transition: background-color 0.3s ease;
        }
        button:hover {
            background-color: #00d8d8;
        }
        .error-message {
            color: red;
            margin-top: 15px;
            font-size: 14px;
        }
        a {
            color: #00f9ff;
            text-decoration: none;
            margin-top: 15px;
            display: block;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h2>ورود مدیر</h2>
        <div class="input-group">
            <label for="username">نام کاربری:</label>
            <input type="text" id="username" name="username">
        </div>
        <div class="input-group">
            <label for="password">رمز عبور:</label>
            <input type="password" id="password" name="password">
        </div>
        <button onclick="loginAdmin()">ورود</button>
        <div id="errorMessage" class="error-message"></div>
        <a href="index.html">بازگشت به صفحه اصلی</a>
    </div>

    <script>
        // اطلاعات مدیر (این اطلاعات باید در پنل مدیر ذخیره شوند، فعلا به صورت ثابت قرار داده شده)
        const adminUsername = "KIYAN22";
        const adminPassword = "3382086190";

        function loginAdmin() {
            const usernameInput = document.getElementById('username').value;
            const passwordInput = document.getElementById('password').value;
            const errorMessageDiv = document.getElementById('errorMessage');

            errorMessageDiv.textContent = ""; // پاک کردن خطای قبلی

            if (usernameInput === adminUsername && passwordInput === adminPassword) {
                // ورود موفقیت آمیز
                window.location.href = "admin-panel.html"; // هدایت به پنل مدیریت
            } else {
                // ورود ناموفق
                errorMessageDiv.textContent = "نام کاربری یا رمز عبور اشتباه است.";
            }
        }
    </script>
</body>
</html>
