<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود به سفینه النجاه</title>
    <style>
        :root {
            --bg-dark: #05080f;
            --card-bg: #0f172a;
            --neon-blue: #00f9ff;
            --accent-purple: #7000ff;
            --text-color: #ffffff;
            --error: #ff4d4d;
        }

        body {
            background-color: var(--bg-dark);
            background-image: radial-gradient(circle at center, #1e293b 0%, #05080f 100%);
            color: var(--text-color);
            font-family: 'Tahoma', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        /* کانتینر اصلی کارت */
        .auth-container {
            background: var(--card-bg);
            width: 100%;
            max-width: 400px;
            padding: 40px;
            border-radius: 25px;
            box-shadow: 0 0 40px rgba(0, 249, 255, 0.15), inset 0 0 20px rgba(255,255,255,0.02);
            border: 1px solid rgba(0, 249, 255, 0.1);
            position: relative;
            transition: all 0.5s ease;
        }

        /* انیمیشن برای جابجایی بین فرم‌ها */
        .auth-container.hidden {
            display: none;
        }

        h1 {
            text-align: center;
            color: var(--neon-blue);
            font-size: 1.8rem;
            margin-bottom: 30px;
            text-shadow: 0 0 10px rgba(0, 249, 255, 0.5);
        }

        .input-group {
            margin-bottom: 20px;
            position: relative;
        }

        label {
            display: block;
            font-size: 0.85rem;
            color: var(--neon-blue);
            margin-bottom: 8px;
            margin-right: 5px;
        }

        input {
            width: 100%;
            padding: 12px 15px;
            background: #05080f;
            border: 1px solid #1e293b;
            border-radius: 12px;
            color: white;
            font-size: 1rem;
            box-sizing: border-box;
            transition: 0.3s;
            outline: none;
        }

        input:focus {
            border-color: var(--neon-blue);
            box-shadow: 0 0 15px rgba(0, 249, 255, 0.2);
        }

        .btn-main {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(45deg, var(--accent-purple), var(--neon-blue));
            color: white;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }

        .btn-main:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(112, 0, 255, 0.4);
        }

        .toggle-link {
            text-align: center;
            margin-top: 25px;
            font-size: 0.9rem;
            color: #888;
        }

        .toggle-link span {
            color: var(--neon-blue);
            cursor: pointer;
            font-weight: bold;
            text-decoration: underline;
        }

        .toggle-link span:hover {
            text-shadow: 0 0 8px var(--neon-blue);
        }

        .error-msg {
            color: var(--error);
            font-size: 0.8rem;
            text-align: center;
            margin-bottom: 15px;
            display: none;
        }

        /* استایل مخصوص فرم ثبت‌نام که کمی بلندتر است */
        .register-mode .auth-container {
            max-width: 450px;
        }

    </style>
</head>
<body>

    <!-- فرم ورود -->
    <div id="loginForm" class="auth-container">
        <h1>🚀 ورود به سفینه</h1>
        <div id="loginError" class="error-msg">ایمیل یا رمز عبور اشتباه است!</div>
        
        <div class="input-group">
            <label>ایمیل یا کد ملی</label>
            <input type="text" id="loginId" placeholder="ایمیل یا کد ملی خود را وارد کنید">
        </div>

        <div class="input-group">
            <label>رمز عبور</label>
            <input type="password" id="loginPass" placeholder="••••••••">
        </div>

        <button class="btn-main" onclick="handleLogin()">ورود به پنل</button>

        <div class="toggle-link">
            هنوز عضو نشده‌ای؟ <span onclick="toggleForms()">ثبت‌نام کنید</span>
        </div>
    </div>

    <!-- فرم ثبت‌نام -->
    <div id="registerForm" class="auth-container" style="display: none;">
        <h1>📝 ثبت‌نام دانش‌آموز</h1>
        <div id="regError" class="error-msg">لطفاً تمامی فیلدها را پر کنید!</div>

        <div class="input-group">
            <label>نام و نام خانوادگی</label>
            <input type="text" id="regName" placeholder="نام کامل">
        </div>

        <div class="input-group">
            <label>ایمیل</label>
            <input type="email" id="regEmail" placeholder="example@mail.com">
        </div>

        <div class="input-group">
            <label>کد ملی</label>
            <input type="text" id="regNational" placeholder="۱۰ رقم">
        </div>

        <div class="input-group">
            <label>شماره تلفن</label>
            <input type="text" id="regPhone" placeholder="0912...">
        </div>

        <div class="input-group">
            <label>رمز عبور</label>
            <input type="password" id="regPass" placeholder="••••••••">
        </div>

        <button class="btn-main" onclick="handleRegister()">ایجاد حساب کاربری</button>

        <div class="toggle-link">
            قبلاً ثبت‌نام کرده‌اید؟ <span onclick="toggleForms()">وارد شوید</span>
        </div>
    </div>

    <script>
        // دیتابیس فرضی (در واقعیت باید از LocalStorage یا سرور خوانده شود)
        // من این را با داده‌های قبلی که برای شما ساختم هماهنگ می‌کنم
        let mockUsers = [
            { id: 1, email: "kian@nav.com", nationalId: "1234567890", pass: "kian123", name: "کیان خان" },
            { id: 2, email: "test@test.com", nationalId: "0987654321", pass: "123456", name: "دانش آموز تست" }
        ];

        // تابع جابجایی بین فرم ورود و ثبت‌نام
        function toggleForms() {
            const loginForm = document.getElementById('loginForm');
            const registerForm = document.getElementById('registerForm');
            const errorMsg = document.getElementById('loginError');
            const regError = document.getElementById('regError');

            errorMsg.style.display = 'none';
            regError.style.display = 'none';

            if (loginForm.style.display === 'none') {
                loginForm.style.display = 'block';
                registerForm.style.display = 'none';
            } else {
                loginForm.style.display = 'none';
                registerForm.style.display = 'block';
            }
        }

        // مدیریت ورود
        function handleLogin() {
            const loginId = document.getElementById('loginId').value.trim();
            const loginPass = document.getElementById('loginPass').value.trim();
            const errorDiv = document.getElementById('loginError');

            // جستجو در دیتابیس فرضی (جستجو بر اساس ایمیل یا کد ملی)
            const user = mockUsers.find(u => 
                (u.email === loginId || u.nationalId === loginId) && u.pass === loginPass
            );

            if (user) {
                errorDiv.style.display = 'none';
                alert(`خوش آمدید، ${user.name}! در حال انتقال به پنل مدیریت...`);
                // در اینجا می‌توانید کاربر را به صفحه اصلی هدایت کنید:
                // window.location.href = 'dashboard.html'; 
            } else {
                errorDiv.style.display = 'block';
            }
        }

        // مدیریت ثبت‌نام
        function handleRegister() {
            const name = document.getElementById('regName').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const national = document.getElementById('regNational').value.trim();
            const phone = document.getElementById('regPhone').value.trim();
            const pass = document.getElementById('regPass').value.trim();
            const errorDiv = document.getElementById('regError');

            if (!name || !email || !national || !phone || !pass) {
                errorDiv.style.display = 'block';
                return;
            }

            // بررسی اینکه کاربر از قبل وجود نداشته باشد
            const exists = mockUsers.find(u => u.email === email || u.nationalId === national);
            if (exists) {
                alert("این ایمیل یا کد ملی قبلاً ثبت شده است!");
                return;
            }

            // اضافه کردن کاربر جدید به دیتابیس فرضی
            const newUser = {
                id: Date.now(),
                name: name,
                email: email,
                nationalId: national,
                phone: phone,
                pass: pass
            };

            mockUsers.push(newUser);
            alert("ثبت‌نام با موفقیت انجام شد! حالا می‌توانید وارد شوید.");
            
            // ذخیره در کنسول برای تست شما
            console.log("User Registered:", newUser);
            console.log("Current Users Database:", mockUsers);

            // بازگشت به فرم ورود
            toggleForms();
        }
    </script>
  <!-- کد جایگزین در بخش اسکریپت -->
<script>
    const STORAGE_KEY = "school_db_students";

    // دریافت لیست و نمایش در جدول
    function renderUsers() {
        const students = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
        const tbody = document.getElementById("userTableBody");
        tbody.innerHTML = "";
        
        students.forEach(student => {
            tbody.innerHTML += `<tr>
                <td>${student.fName}</td>
                <td>${student.email}</td>
                <td>${student.nationalId}</td>
                <td><button onclick="deleteUser(${student.id})">حذف</button></td>
            </tr>`;
        });
    }

    // افزودن دانش‌آموز توسط ادمین
    function addUser() {
        let students = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
        const newStudent = {
            id: Date.now(),
            fName: document.getElementById("fName").value,
            email: document.getElementById("email").value,
            nationalId: document.getElementById("nationalId").value,
            pass: document.getElementById("pass").value
        };

        students.push(newStudent);
        localStorage.setItem(STORAGE_KEY, JSON.stringify(students));
        renderUsers();
    }

    // حذف دانش‌آموز
    function deleteUser(id) {
        let students = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
        students = students.filter(s => s.id !== id);
        localStorage.setItem(STORAGE_KEY, JSON.stringify(students));
        renderUsers();
    }

    // فراخوانی اولیه
    renderUsers();
</script>

</body>
</html>
