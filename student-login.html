<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود و ثبت نام دانش‌آموز | سفینه النجاه</title>
    <style>
        :root {
            --bg-dark: #05080f;
            --card-bg: #0f172a;
            --neon-blue: #00f9ff;
            --accent-purple: #7000ff;
            --text-color: #ffffff;
            --error: #ff4d4d;
        }

        body {
            background-color: var(--bg-dark);
            background-image: radial-gradient(circle at center, #1e293b 0%, #05080f 100%);
            color: var(--text-color);
            font-family: 'Tahoma', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .auth-container {
            background: var(--card-bg);
            width: 90%;
            max-width: 420px;
            padding: 30px;
            border-radius: 25px;
            box-shadow: 0 0 40px rgba(0, 249, 255, 0.15);
            border: 1px solid rgba(0, 249, 255, 0.1);
        }

        h1 {
            text-align: center;
            color: var(--neon-blue);
            font-size: 1.8rem;
            margin-bottom: 25px;
            text-shadow: 0 0 10px rgba(0, 249, 255, 0.5);
        }

        .input-group { margin-bottom: 15px; }

        label {
            display: block;
            font-size: 0.85rem;
            color: var(--neon-blue);
            margin-bottom: 5px;
        }

        input {
            width: 100%;
            padding: 12px;
            background: #05080f;
            border: 1px solid #1e293b;
            border-radius: 10px;
            color: white;
            box-sizing: border-box;
            outline: none;
        }

        input:focus { border-color: var(--neon-blue); }

        .btn-main {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(45deg, var(--accent-purple), var(--neon-blue));
            color: white;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        .toggle-link {
            text-align: center;
            margin-top: 20px;
            font-size: 0.85rem;
            color: #888;
        }

        .toggle-link span { color: var(--neon-blue); cursor: pointer; text-decoration: underline; }
    </style>
</head>
<body>

    <!-- فرم ورود -->
    <div id="loginForm" class="auth-container">
        <h1>🚀 ورود به پنل دانش‌آموزی</h1>
        <div class="input-group">
            <label>کد ملی یا ایمیل</label>
            <input type="text" id="loginId" placeholder="وارد کنید...">
        </div>
        <div class="input-group">
            <label>رمز عبور</label>
            <input type="password" id="loginPass" placeholder="••••••••">
        </div>
        <button class="btn-main" onclick="handleLogin()">ورود</button>
        <div class="toggle-link">حساب کاربری ندارید؟ <span onclick="toggleForms()">ثبت‌نام کنید</span></div>
    </div>

    <!-- فرم ثبت‌نام -->
    <div id="registerForm" class="auth-container" style="display: none;">
        <h1>📝 ثبت‌نام دانش‌آموز</h1>
        <div class="input-group"><label>نام</label><input type="text" id="regFName"></div>
        <div class="input-group"><label>نام خانوادگی</label><input type="text" id="regLName"></div>
        <div class="input-group"><label>ایمیل</label><input type="email" id="regEmail"></div>
        <div class="input-group"><label>کد ملی</label><input type="text" id="regNational"></div>
        <div class="input-group"><label>شماره تلفن</label><input type="text" id="regPhone"></div>
        <div class="input-group"><label>رمز عبور</label><input type="password" id="regPass"></div>
        <button class="btn-main" onclick="handleRegister()">ثبت نام آنلاین</button>
        <div class="toggle-link">قبلاً ثبت‌نام کرده‌اید؟ <span onclick="toggleForms()">وارد شوید</span></div>
    </div>

    <!-- اتصال به Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        // تنظیمات پروژه Firebase خود را جایگزین کنید
        const firebaseConfig = {
            databaseURL: "https://YOUR_PROJECT_ID.firebaseio.com"
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        function toggleForms() {
            const lForm = document.getElementById('loginForm');
            const rForm = document.getElementById('registerForm');
            lForm.style.display = lForm.style.display === 'none' ? 'block' : 'none';
            rForm.style.display = rForm.style.display === 'none' ? 'block' : 'none';
        }

        function handleRegister() {
            const fName = document.getElementById('regFName').value.trim();
            const lName = document.getElementById('regLName').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const nationalId = document.getElementById('regNational').value.trim();
            const phone = document.getElementById('regPhone').value.trim();
            const pass = document.getElementById('regPass').value.trim();

            if(!fName || !nationalId || !pass) {
                alert("لطفاً تمامی فیلدهای ضروری را پر کنید.");
                return;
            }

            const userId = nationalId; // استفاده از کد ملی به عنوان ID منحصر‌به‌فرد
            const userData = { id: userId, fName, lName, email, nationalId, phone, pass };

            // ذخیره همزمان در پایگاه داده آنلاین
            database.ref('students/' + userId).set(userData, (error) => {
                if (error) {
                    alert("خطا در ذخیره‌سازی داده‌ها!");
                } else {
                    localStorage.setItem('currentStudentId', userId);
                    alert("ثبت‌نام موفقیت‌آمیز بود!");
                    window.location.href = "student_dashboard.html";
                }
            });
        }

        function handleLogin() {
            const loginId = document.getElementById('loginId').value.trim();
            const loginPass = document.getElementById('loginPass').value.trim();

            database.ref('students/' + loginId).once('value', (snapshot) => {
                const user = snapshot.val();
                if (user && user.pass === loginPass) {
                    localStorage.setItem('currentStudentId', user.id);
                    window.location.href = "student_dashboard.html";
                } else {
                    alert("کد ملی/ایمیل یا رمز عبور اشتباه است!");
                }
            });
        }
    </script>
</body>
</html>
