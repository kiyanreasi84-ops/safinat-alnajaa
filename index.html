<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>سفینه النجاه</title>
    <style>
        body {
            font-family: sans-serif;
            background: #1a1a2e; /* مشکی-آبی تیره */
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column; /* برای قرار گرفتن هدر و محتوا روی هم */
            justify-content: center;
            align-items: center;
            color: #fff;
            overflow-x: hidden; /* جلوگیری از اسکرول افقی */
        }

        header {
            background: #0f3460; /* آبی تیره */
            width: 100%;
            padding: 22px 16px;
            text-align: center;
            font-size: 26px;
            font-weight: bold;
            color: #00f9ff; /* آبی روشن */
            border-bottom: 2px solid #00f9ff;
            box-shadow: 0 2px 10px rgba(0, 255, 255, 0.25);
            position: fixed; /* هدر ثابت */
            top: 0;
            right: 0;
            left: 0;
            z-index: 1000; /* اطمینان از اینکه هدر همیشه بالای همه چیز باشد */
        }

        .container {
            width: 92%;
            max-width: 720px;
            margin: 120px auto 0 auto; /* کمی فاصله از بالای صفحه به خاطر هدر */
            background: rgba(15, 52, 96, 0.82);
            border-radius: 12px;
            padding: 34px 20px;
            box-shadow: 0 0 22px rgba(0, 255, 255, 0.35);
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h2 {
            margin: 0 0 18px 0;
            font-size: 24px; /* کمی بزرگتر */
            color: #ffffff;
            font-weight: bold;
        }

        p {
            margin: 0 0 25px 0; /* کمی فاصله بیشتر زیر متن */
            font-size: 18px;
            line-height: 1.8;
            color: #e9f7ff;
        }

        .button {
            display: block; /* دکمه‌ها زیر هم قرار بگیرند */
            background: #00f9ff;
            color: #1a1a2e;
            padding: 16px 22px; /* کمی بزرگتر */
            margin: 10px 0; /* فاصله بین دکمه‌ها */
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
            font-size: 20px; /* کمی بزرگتر */
            width: 85%; /* عرض دکمه‌ها */
            max-width: 300px; /* حداکثر عرض برای دکمه‌ها */
            transition: transform 0.2s ease, background-color 0.3s ease, box-shadow 0.3s ease;
            box-shadow: 0 4px 12px rgba(0, 255, 255, 0.25);
        }
        .button:hover {
            background: #00d8d8; /* آبی روشن‌تر */
            transform: translateY(-3px); /* کمی حرکت به بالا */
            box-shadow: 0 6px 15px rgba(0, 255, 255, 0.35);
        }

        /* برای نمایش دکمه‌ها در صفحه نمایش‌های کوچکتر */
        @media (max-width: 768px) {
            .container {
                width: 95%;
                padding: 25px 15px;
            }
            header {
                font-size: 22px;
                padding: 18px 12px;
            }
            .button {
                font-size: 18px;
                padding: 14px 18px;
                width: 90%;
            }
            h2 {
                font-size: 22px;
            }
            p {
                font-size: 17px;
            }
        }
    </style>
</head>
<body>
    <header>
        به سامانه رسمی موسسه سفینه النجاه خوش امدید
    </header>

    <div class="container">
        <h2>به سامانه رسمی موسسه سفینه النجاه خوش آمدید</h2>
        <p>
            برای ادامه، لطفا یکی از گزینه‌های زیر را انتخاب کنید:
        </p>

        <a href="admin-login.html" class="button">ورود به پنل مدیریت</a>
        <a href="student-login.html" class="button">ورود پنل دانش آموزان</a>
    </div>
</body>
</html>
