<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>سفینه النجاه</title>
    <style>
        body {
            font-family: sans-serif;
            background: #1a1a2e;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #fff;
            overflow-x: hidden;
        }

        header {
            background: #0f3460;
            width: 100%;
            padding: 22px 16px;
            text-align: center;
            font-size: 26px;
            font-weight: bold;
            color: #00f9ff;
            border-bottom: 2px solid #00f9ff;
            box-shadow: 0 2px 10px rgba(0, 255, 255, 0.25);
            position: fixed;
            top: 0;
            right: 0;
            left: 0;
            z-index: 1000;
        }

        .container {
            width: 92%;
            max-width: 720px;
            margin: 120px auto 0 auto;
            background: rgba(15, 52, 96, 0.82);
            border-radius: 12px;
            padding: 34px 20px;
            box-shadow: 0 0 22px rgba(0, 255, 255, 0.35);
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h2 {
            margin: 0 0 18px 0;
            font-size: 24px;
            color: #ffffff;
            font-weight: bold;
        }

        p {
            margin: 0 0 25px 0;
            font-size: 18px;
            line-height: 1.8;
            color: #e9f7ff;
        }

        /* ✅ استایل مشترک برای همه دکمه‌ها */
        .button {
            display: block;
            background: #00f9ff;
            color: #1a1a2e;
            padding: 16px 22px;
            margin: 10px 0;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
            font-size: 20px;
            width: 85%;
            max-width: 300px;
            transition: transform 0.2s ease, background-color 0.3s ease, box-shadow 0.3s ease;
            box-shadow: 0 4px 12px rgba(0, 255, 255, 0.25);
            cursor: pointer;
            border: none;         /* ✅ حذف بوردر پیش‌فرض دکمه */
            font-family: sans-serif; /* ✅ فونت یکسان */
        }

        .button:hover {
            background: #00d8d8;
            transform: translateY(-3px);
            box-shadow: 0 6px 15px rgba(0, 255, 255, 0.35);
        }

        /* ✅ انیمیشن لودینگ روی دکمه */
        .button.loading {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        /* ✅ اوورلی لودینگ */
        #loadingOverlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(5, 8, 15, 0.85);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            gap: 20px;
        }

        #loadingOverlay.show {
            display: flex;
        }

        /* ✅ دایره اسپینر */
        .spinner {
            width: 60px;
            height: 60px;
            border: 5px solid rgba(0, 249, 255, 0.2);
            border-top-color: #00f9ff;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            color: #00f9ff;
            font-size: 18px;
            letter-spacing: 1px;
            animation: pulse 1.2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        @media (max-width: 768px) {
            .container {
                width: 95%;
                padding: 25px 15px;
            }
            header {
                font-size: 22px;
                padding: 18px 12px;
            }
            .button {
                font-size: 18px;
                padding: 14px 18px;
                width: 90%;
            }
            h2 { font-size: 22px; }
            p  { font-size: 17px; }
        }
    </style>
</head>
<body>

    <header>
        به سامانه رسمی موسسه سفینه النجاه خوش امدید
    </header>

    <!-- ✅ اوورلی لودینگ -->
    <div id="loadingOverlay">
        <div class="spinner"></div>
        <div class="loading-text">در حال انتقال ...</div>
    </div>

    <div class="container">
        <h2>به سامانه رسمی موسسه سفینه النجاه خوش آمدید</h2>
        <p>
            برای ادامه، لطفا یکی از گزینه‌های زیر را انتخاب کنید:
        </p>

        <!-- ✅ دکمه مدیریت (همچنان a tag) -->
        <a href="admin-login.html" class="button">ورود به پنل مدیریت</a>

        <!-- ✅ دکمه دانش آموز - با JS هندل میشه -->
        <button class="button" id="studentBtn" onclick="goToStudentLogin()">
            ورود پنل دانش آموزان
        </button>
    </div>

    <script>
        // ✅ تابع اصلی هدایت به صفحه دانش آموز
        function goToStudentLogin() {
            const btn = document.getElementById('studentBtn');
            const overlay = document.getElementById('loadingOverlay');

            // ✅ غیرفعال کردن دکمه تا کلیک مجدد نشه
            btn.classList.add('loading');
            btn.disabled = true;
            btn.textContent = '⏳ در حال انتقال...';

            // ✅ نمایش اوورلی لودینگ
            overlay.classList.add('show');

            // ✅ بعد از 1.2 ثانیه به صفحه دانش آموز برو
            setTimeout(() => {
                window.location.href = 'student-login.html';
            }, 1200);
        }

        // ✅ اگر کاربر با کلیک back برگشت، دکمه رو reset کن
        window.addEventListener('pageshow', function(event) {
            const btn = document.getElementById('studentBtn');
            const overlay = document.getElementById('loadingOverlay');

            btn.classList.remove('loading');
            btn.disabled = false;
            btn.textContent = 'ورود پنل دانش آموزان';
            overlay.classList.remove('show');
        });
    </script>

</body>
</html>
